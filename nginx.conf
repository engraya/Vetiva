# Serves the built SPA. MSW (mockServiceWorker.js) is the app's backend,
# so serving that file correctly at the root scope is load-bearing.
#
# nginx pitfall: `add_header` inside a location block REPLACES every
# server-level add_header, so the security headers are repeated in each
# location that sets Cache-Control.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Service worker: must always revalidate — a stale worker means a stale
    # mock API, which breaks the whole app after a redeploy.
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA shell: always revalidate so redeploys pick up new hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Hashed assets: cache forever; a missing chunk must 404, not fall back
    # to index.html (that would feed HTML to dynamic import()).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA fallback for react-router deep links.
    location / {
        try_files $uri /index.html;
    }
}
